<section id="testimonials">
  <div class="container">
    <div class="flex-row">
      <div class="col-2"></div>
      <div class="col-8 align-center">
        <h1>Testimonials Works!</h1>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas fuga
          quae consectetur soluta sit. Accusamus nam numquam, rem earum expedita
          est. Inventore quaerat amet cumque esse soluta magnam id accusamus?
        </p>
      </div>
      <div class="col-2"></div>
    </div>
    <div class="flex-row">
      <section class="testimonials-carousel">
        <div class="carousel-container">
          <button
            mat-icon-button
            class="scroll-button left"
            (click)="scrollLeft(carousel)"
          >
            <mat-icon>chevron_left</mat-icon>
          </button>
          <div class="carousel" #carousel>
            <mat-card
              *ngFor="let testimonial of testimonials"
              class="testimonial-card"
            >
              <div class="testimonial-content">
                <img [src]="testimonial.image" alt="{{ testimonial.name }}" />
                <h3>{{ testimonial.name }}</h3>
                <p>{{ testimonial.testimonial }}</p>
              </div>
            </mat-card>
          </div>

          <button
            mat-icon-button
            class="scroll-button right"
            (click)="scrollRight(carousel)"
          >
            <mat-icon>chevron_right</mat-icon>
          </button>
        </div>
      </section>
    </div>
  </div>
</section>
