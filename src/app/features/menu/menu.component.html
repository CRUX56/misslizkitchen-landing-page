<section id="menu">
  <div class="container">
    <div class="flex-row">
      <div class="col-12">
        <span class="subHeader">Lorem Ante IOS</span>
        <h3>Our Favorite Eats</h3>
      </div>
    </div>
    <div class="flex-row featured-dish">
      <div class="col-3 menu-item" *ngFor="let item of menuItems">
        <mat-card appearance="outlined">
          <mat-card-header></mat-card-header>
          <mat-card-content>
            <img mat-card-image [src]="item.menuItemPic" alt="" />
            <h5>{{ item.menuItem }}</h5>
            <p>{{ item.dishDescription }}</p>
          </mat-card-content>
        </mat-card>
      </div>
      <!--<div class="menu-item-container">
          <img [src]="item.menuItemPic" alt="" />
          <h4>{{ item.menuItem }}</h4>
          <p>{{ item.dishDescription }}</p>
        </div>
      </div>-->
    </div>
  </div>
</section>
